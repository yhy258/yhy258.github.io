- title: "Generalizing Deep Surrogate Solvers for Broadband Electromagnetic Field Prediction at Unseen Wavelengths"
  authors: "†Joonhyuk Seo, †C Kang, D Seo, H Chung"
  venue: "Arxiv 2025"
  url: "https://arxiv.org/abs/2408.02971"
  pdf: "images/pdfs/GeneralizationEMsolv.pdf"
  image: "images/Surrogatesolver-abstract.png"
  description: "A novel electromagnetic surrogate solver that enables the interpolated prediction of unseen wavelengths from simulation observations of discrete wavelength."
  highlights:
    - "Created an electromagnetic simulation dataset through a Finite-Difference Frequency-Domain simulator (Ceviche)"
    - "Proposed a conditioning method for strong regularization and a parameter-efficient neural operator architecture"
    - "A 74% reduction in parameters and 80.5% improvements in prediction accuracy for untrained wavelengths, and 13.2% improvements for trained wavelengths"

- title: "Deep-learning-driven end-to-end metalens imaging"
  authors: "†Joonhyuk Seo, †J Jo, †J Kim, †J Kang, C Kang, S Moon, E Lee, J Hong, J Rho, H Chung"
  venue: "Advanced Photonics 2024"
  venue_info: "Advanced Photonics (IF: 20.6) – Top-tier journal in Optics"
  url: "https://doi.org/10.1117/1.AP.6.6.066002"
  pdf: "images/pdfs/MetaIR.pdf"
  image: "images/Metalensimage-method.png"
  description: "Developed an image restoration model to alleviate severe and complex degradations, which is a highly ill-posed inverse problem."
  highlights:
    - "Employed an auxiliary generative model, a generative adversarial network (GAN), in order to reflect the data distribution of latent clean images"
    - "Elevated the PSNR by 7.37 dB and SSIM by 22.8%p compared to the original metalens images"

