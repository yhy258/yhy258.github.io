<div class="masthead">
  <div class="masthead__inner">
    <a class="masthead__home" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav class="masthead__nav" aria-label="Site">
      {% for link in site.data.navigation.main %}
        {% assign current = false %}
        {% if link.url == "/blog/" and page.url contains "/blog/" %}{% assign current = true %}{% endif %}
        <a href="{{ link.url | relative_url }}"{% if current %} class="is-current"{% endif %}>{{ link.title }}</a>
      {% endfor %}
    </nav>
  </div>
</div>
